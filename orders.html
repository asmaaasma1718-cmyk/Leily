<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders - Leily</title>

    <style>
        :root {
            --pink: #f3d6df;
            --pink-dark: #d99aaa;
            --pink-soft: #faeef2;
            --cream: #fffaf5;
            --white: #ffffff;
            --text: #5b4b50;
            --muted: #9a858b;
            --border: #eadde0;
            --shadow: 0 8px 24px rgba(110, 75, 85, 0.08);
            --green: #86a98d;
            --blue: #91a9c0;
            --orange: #c79a72;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--cream);
            color: var(--text);
            font-family: Arial, sans-serif;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        /* TOP BAR */

        .topbar {
            height: 64px;
            background: var(--white);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text);
            font-size: 24px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--pink-soft);
        }

        .topbar-title {
            font-size: 18px;
            font-weight: 600;
        }

        /* PAGE */

        .page {
            width: min(100%, 950px);
            margin: 0 auto;
            padding: 24px 16px 60px;
        }

        .page-header {
            margin-bottom: 20px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 27px;
        }

        .page-header p {
            margin: 7px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        /* SUMMARY */

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .summary-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 13px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .summary-number {
            display: block;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .summary-label {
            color: var(--muted);
            font-size: 11px;
        }

        /* FILTERS */

        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 17px;
        }

        .filter-btn {
            border: 1px solid var(--border);
            background: var(--white);
            color: var(--text);
            border-radius: 12px;
            padding: 9px 14px;
            white-space: nowrap;
            font-size: 13px;
        }

        .filter-btn.active {
            background: var(--pink-dark);
            border-color: var(--pink-dark);
            color: white;
        }

        /* ORDER LIST */

        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .order-card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 19px;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
        }

        .order-number {
            font-size: 13px;
            color: var(--muted);
        }

        .order-date {
            font-size: 12px;
            color: var(--muted);
            margin-top: 4px;
        }

        .status {
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }

        .status.new {
            background: var(--pink-soft);
            color: var(--pink-dark);
        }

        .status.confirmed {
            background: #edf4ee;
            color: var(--green);
        }

        .status.sent {
            background: #eef3f8;
            color: var(--blue);
        }

        .status.complete {
            background: #f2eee9;
            color: #8c7662;
        }

        /* CUSTOMER */

        .section-title {
            font-size: 13px;
            font-weight: 700;
            margin: 14px 0 8px;
        }

        .customer-box {
            background: #fffdfc;
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 11px 12px;
        }

        .customer-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 5px 0;
            font-size: 13px;
        }

        .customer-row span:first-child {
            color: var(--muted);
        }

        .customer-row span:last-child {
            text-align: right;
        }

        /* PRODUCT */

        .product-box {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #fffdfc;
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 10px;
        }

        .product-image {
            width: 65px;
            height: 65px;
            border-radius: 11px;
            overflow: hidden;
            background: var(--pink-soft);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .placeholder-image {
            font-size: 27px;
            opacity: 0.5;
        }

        .product-details {
            flex: 1;
            min-width: 0;
        }

        .product-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .product-meta {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .product-total {
            font-weight: 700;
            color: var(--pink-dark);
            font-size: 14px;
            white-space: nowrap;
        }

        /* PAYMENT */

        .payment-box {
            background: var(--pink-soft);
            border-radius: 13px;
            padding: 11px 12px;
            margin-top: 10px;
            font-size: 13px;
        }

        .payment-box strong {
            font-weight: 600;
        }

        .payment-note {
            color: var(--muted);
            font-size: 11px;
            margin-top: 5px;
            line-height: 1.5;
        }

        /* ACTIONS */

        .order-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .action-btn {
            flex: 1;
            border-radius: 11px;
            padding: 10px;
            font-size: 12px;
        }

        .primary-action {
            background: var(--pink-dark);
            color: white;
            border: 1px solid var(--pink-dark);
        }

        .secondary-action {
            background: white;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .danger-action {
            color: #bd7d87;
            background: white;
            border: 1px solid #ead8dc;
        }

        /* EMPTY */

        .empty-state {
            background: var(--white);
            border: 1px dashed var(--border);
            border-radius: 20px;
            padding: 45px 20px;
            text-align: center;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .empty-state h3 {
            margin: 0 0 7px;
        }

        .empty-state p {
            color: var(--muted);
            font-size: 13px;
            margin: 0;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .page {
                padding: 20px 13px 50px;
            }

            .page-header h1 {
                font-size: 23px;
            }

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .summary-card {
                padding: 11px;
            }

            .order-card {
                padding: 13px;
            }

            .customer-row {
                flex-direction: column;
                gap: 2px;
            }

            .customer-row span:last-child {
                text-align: left;
            }

            .order-actions {
                flex-wrap: wrap;
            }

            .action-btn {
                min-width: 45%;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <div class="topbar">

        <a href="seller.html" class="back-btn">
            ‹
        </a>

        <div class="topbar-title">
            Orders
        </div>

    </div>


    <!-- PAGE -->

    <main class="page">

        <div class="page-header">

            <h1>
                Orders
            </h1>

            <p>
                Manage your customer orders.
            </p>

        </div>


        <!-- SUMMARY -->

        <div class="summary">

            <div class="summary-card">
                <span
                    class="summary-number"
                    id="newCount"
                >
                    0
                </span>

                <span class="summary-label">
                    New
                </span>
            </div>


            <div class="summary-card">
                <span
                    class="summary-number"
                    id="confirmedCount"
                >
                    0
                </span>

                <span class="summary-label">
                    Confirmed
                </span>
            </div>


            <div class="summary-card">
                <span
                    class="summary-number"
                    id="sentCount"
                >
                    0
                </span>

                <span class="summary-label">
                    Sent
                </span>
            </div>


            <div class="summary-card">
                <span
                    class="summary-number"
                    id="completeCount"
                >
                    0
                </span>

                <span class="summary-label">
                    Complete
                </span>
            </div>

        </div>


        <!-- FILTERS -->

        <div class="filters">

            <button
                class="filter-btn active"
                data-filter="all"
                onclick="setFilter('all', this)"
            >
                All
            </button>

            <button
                class="filter-btn"
                data-filter="New"
                onclick="setFilter('New', this)"
            >
                New
            </button>

            <button
                class="filter-btn"
                data-filter="Confirmed"
                onclick="setFilter('Confirmed', this)"
            >
                Confirmed
            </button>

            <button
                class="filter-btn"
                data-filter="Sent"
                onclick="setFilter('Sent', this)"
            >
                Sent
            </button>

            <button
                class="filter-btn"
                data-filter="Complete"
                onclick="setFilter('Complete', this)"
            >
                Complete
            </button>

        </div>


        <!-- ORDERS -->

        <div
            id="ordersList"
            class="orders-list"
        ></div>


        <!-- EMPTY -->

        <div
            id="emptyState"
            class="empty-state"
        >

            <div class="empty-icon">
                📦
            </div>

            <h3>
                No orders yet
            </h3>

            <p>
                Customer orders will appear here.
            </p>

        </div>

    </main>


    <script>

        /*
         * ==========================================
         * LEILY - SELLER ORDERS
         * ==========================================
         *
         * This page is currently prepared for
         * the prototype stage.
         *
         * Later, real orders will come from
         * Supabase.
         */


        const ORDERS_KEY = "leilySellerOrders";

        let orders = [];

        let currentFilter = "all";


        /* ==========================================
           LOAD ORDERS
        ========================================== */

        function loadOrders() {

            try {

                const saved =
                    localStorage.getItem(
                        ORDERS_KEY
                    );

                orders = saved
                    ? JSON.parse(saved)
                    : [];

            } catch (error) {

                console.error(
                    "Could not load orders:",
                    error
                );

                orders = [];
            }


            updateSummary();

            renderOrders();
        }


        /* ==========================================
           SUMMARY
        ========================================== */

        function updateSummary() {

            const newOrders =
                orders.filter(
                    order =>
                        order.status === "New"
                ).length;


            const confirmed =
                orders.filter(
                    order =>
                        order.status === "Confirmed"
                ).length;


            const sent =
                orders.filter(
                    order =>
                        order.status === "Sent"
                ).length;


            const complete =
                orders.filter(
                    order =>
                        order.status === "Complete"
                ).length;


            document.getElementById(
                "newCount"
            ).textContent = newOrders;


            document.getElementById(
                "confirmedCount"
            ).textContent = confirmed;


            document.getElementById(
                "sentCount"
            ).textContent = sent;


            document.getElementById(
                "completeCount"
            ).textContent = complete;
        }


        /* ==========================================
           FILTER
        ========================================== */

        function setFilter(
            filter,
            button
        ) {

            currentFilter = filter;


            document
                .querySelectorAll(".filter-btn")
                .forEach(btn => {

                    btn.classList.remove(
                        "active"
                    );

                });


            button.classList.add("active");


            renderOrders();
        }


        /* ==========================================
           RENDER ORDERS
        ========================================== */

        function renderOrders() {

            const list =
                document.getElementById(
                    "ordersList"
                );

            const empty =
                document.getElementById(
                    "emptyState"
                );


            list.innerHTML = "";


            let filteredOrders =
                orders;


            if (
                currentFilter !== "all"
            ) {

                filteredOrders =
                    orders.filter(
                        order =>
                            order.status ===
                            currentFilter
                    );
            }


            if (
                filteredOrders.length === 0
            ) {

                empty.style.display = "block";

                return;
            }


            empty.style.display = "none";


            filteredOrders.forEach(
                order => {

                    list.appendChild(
                        createOrderCard(order)
                    );

                }
            );
        }


        /* ==========================================
           CREATE ORDER CARD
        ========================================== */

        function createOrderCard(order) {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "order-card";


            const product =
                order.product || {};


            const customer =
                order.customer || {};


            const payment =
                order.payment || {};


            const image =
                product.image ||
                product.images?.[0] ||
                "";


            const statusClass =
                String(order.status || "New")
                    .toLowerCase();


            const nextAction =
                getNextAction(order.status);


            card.innerHTML = `

                <div class="order-top">

                    <div>

                        <div class="order-number">
                            Order #${escapeHTML(
                                order.id || "0001"
                            )}
                        </div>

                        <div class="order-date">
                            ${formatDate(
                                order.createdAt
                            )}
                        </div>

                    </div>


                    <span
                        class="status ${statusClass}"
                    >
                        ${escapeHTML(
                            order.status || "New"
                        )}
                    </span>

                </div>


                <div class="section-title">
                    Customer
                </div>


                <div class="customer-box">

                    <div class="customer-row">
                        <span>Name</span>
                        <span>
                            ${escapeHTML(
                                customer.name || "—"
                            )}
                        </span>
                    </div>


                    <div class="customer-row">
                        <span>Phone</span>
                        <span>
                            ${escapeHTML(
                                customer.phone || "—"
                            )}
                        </span>
                    </div>


                    <div class="customer-row">
                        <span>Wilaya</span>
                        <span>
                            ${escapeHTML(
                                customer.wilaya || "—"
                            )}
                        </span>
                    </div>


                    <div class="customer-row">
                        <span>Municipality</span>
                        <span>
                            ${escapeHTML(
                                customer.municipality || "—"
                            )}
                        </span>
                    </div>


                    <div class="customer-row">
                        <span>Address</span>
                        <span>
                            ${escapeHTML(
                                customer.address || "—"
                            )}
                        </span>
                    </div>

                </div>


                <div class="section-title">
                    Product
                </div>


                <div class="product-box">

                    <div class="product-image">

                        ${
                            image

                            ? `<img
                                src="${image}"
                                alt="Product"
                            >`

                            : `<div class="placeholder-image">
                                🛍️
                            </div>`
                        }

                    </div>


                    <div class="product-details">

                        <div class="product-name">
                            ${escapeHTML(
                                product.name || "Product"
                            )}
                        </div>


                        <div class="product-meta">

                            Quantity:
                            ${product.quantity || 1}

                            ${
                                product.size
                                ? `<br>Size: ${escapeHTML(
                                    product.size
                                )}`
                                : ""
                            }

                            ${
                                product.color
                                ? `<br>Color: ${escapeHTML(
                                    product.color
                                )}`
                                : ""
                            }

                        </div>

                    </div>


                    <div class="product-total">

                        ${formatPrice(
                            order.total ||
                            product.price ||
                            0
                        )}
                        DA

                    </div>

                </div>


                <div class="payment-box">

                    <strong>
                        Payment:
                    </strong>

                    ${escapeHTML(
                        payment.method ||
                        "Cash on delivery"
                    )}

                    ${
                        payment.note
                        ? `<div class="payment-note">
                            ${escapeHTML(
                                payment.note
                            )}
                        </div>`
                        : ""
                    }

                </div>


                <div class="order-actions">

                    ${
                        nextAction

                        ? `<button
                            class="action-btn primary-action"
                            onclick="advanceOrder('${order.id}')"
                        >
                            ${nextAction}
                        </button>`

                        : ""
                    }


                    <button
                        class="action-btn secondary-action"
                        onclick="viewOrder('${order.id}')"
                    >
                        View Details
                    </button>

                </div>

            `;


            return card;
        }


        /* ==========================================
           NEXT STATUS
        ========================================== */

        function getNextAction(status) {

            if (status === "New") {
                return "Confirm Order";
            }

            if (status === "Confirmed") {
                return "Mark as Sent";
            }

            if (status === "Sent") {
                return "Mark Complete";
            }

            return "";
        }


        /* ==========================================
           ADVANCE ORDER
        ========================================== */

        function advanceOrder(id) {

            const index =
                orders.findIndex(
                    order =>
                        order.id === id
                );


            if (index === -1) {
                return;
            }


            const order =
                orders[index];


            if (
                order.status === "New"
            ) {

                order.status =
                    "Confirmed";

            }

            else if (
                order.status === "Confirmed"
            ) {

                order.status =
                    "Sent";

            }

            else if (
                order.status === "Sent"
            ) {

                order.status =
                    "Complete";

            }


            order.updatedAt =
                new Date().toISOString();


            try {

                localStorage.setItem(
                    ORDERS_KEY,
                    JSON.stringify(orders)
                );

            } catch (error) {

                console.error(error);

                alert(
                    "Could not save the order status."
                );

                return;
            }


            updateSummary();

            renderOrders();
        }


        /* ==========================================
           VIEW ORDER
        ========================================== */

        function viewOrder(id) {

            const order =
                orders.find(
                    item =>
                        item.id === id
                );


            if (!order) {
                return;
            }


            const customer =
                order.customer || {};


            const product =
                order.product || {};


            alert(
                "Order Details\n\n" +

                "Order: #" +
                (order.id || "") +

                "\n\nCustomer: " +
                (customer.name || "—") +

                "\nPhone: " +
                (customer.phone || "—") +

                "\nWilaya: " +
                (customer.wilaya || "—") +

                "\nMunicipality: " +
                (customer.municipality || "—") +

                "\nAddress: " +
                (customer.address || "—") +

                "\n\nProduct: " +
                (product.name || "—") +

                "\nQuantity: " +
                (product.quantity || 1) +

                "\n\nStatus: " +
                (order.status || "New")
            );
        }


        /* ==========================================
           FORMAT DATE
        ========================================== */

        function formatDate(date) {

            if (!date) {
                return "Date unavailable";
            }


            const parsed =
                new Date(date);


            if (
                Number.isNaN(
                    parsed.getTime()
                )
            ) {

                return "Date unavailable";
            }


            return parsed.toLocaleDateString(
                "en-GB",
                {
                    day: "2-digit",
                    month: "short",
                    year: "numeric"
                }
            );
        }


        /* ==========================================
           FORMAT PRICE
        ========================================== */

        function formatPrice(value) {

            return Number(
                value || 0
            ).toLocaleString(
                "en-US"
            );
        }


        /* ==========================================
           ESCAPE HTML
        ========================================== */

        function escapeHTML(value) {

            return String(
                value ?? ""
            )
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
        }


        /* ==========================================
           START
        ========================================== */

        loadOrders();

    </script>

</body>
</html>
