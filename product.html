<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#f8dfe5"
>

<title>Leily — Product</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

    /* PRODUCT PAGE */

    .product-page {
        width: min(1180px, 90%);
        margin: 45px auto 100px;
    }


    .product-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;

        margin-bottom: 35px;
    }


    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 8px;

        color: var(--muted);

        text-decoration: none;

        font-size: 14px;

        transition: 0.2s;
    }


    .back-link:hover {
        color: var(--text);
    }


    .product-logo {
        width: 95px;
        height: auto;
    }


    .product-layout {
        display: grid;

        grid-template-columns:
            minmax(0, 1.05fr)
            minmax(0, 0.95fr);

        gap: 55px;

        align-items: start;
    }


    /* IMAGE */

    .product-gallery {
        position: sticky;
        top: 105px;
    }


    .main-product-image {
        aspect-ratio: 0.88;

        width: 100%;

        border-radius: var(--radius-large);

        overflow: hidden;

        background: var(--cream);
    }


    .main-product-placeholder {
        width: 100%;
        height: 100%;

        display: grid;
        place-items: center;

        background:
            linear-gradient(
                145deg,
                #fbf0f1,
                #f8f4ed
            );

        color: #b9acae;

        font-size: 14px;
    }


    .thumbnail-row {
        display: flex;

        gap: 10px;

        margin-top: 12px;

        overflow-x: auto;

        scrollbar-width: none;
    }


    .thumbnail-row::-webkit-scrollbar {
        display: none;
    }


    .thumbnail {
        flex: 0 0 72px;

        width: 72px;
        height: 72px;

        border-radius: 13px;

        border: 1px solid var(--border);

        background: var(--cream);

        display: grid;
        place-items: center;

        color: #b9acae;

        font-size: 10px;
    }


    .thumbnail.active {
        border-color: var(--pink-400);
    }


    /* INFORMATION */

    .product-information {
        padding: 5px 0;
    }


    .product-category {
        color: var(--pink-400);

        font-size: 12px;

        text-transform: uppercase;

        letter-spacing: 0.08em;

        font-weight: 600;

        margin-bottom: 9px;
    }


    .product-information h1 {
        font-size: clamp(32px, 4vw, 46px);

        line-height: 1.1;

        font-weight: 500;

        letter-spacing: -0.035em;

        margin-bottom: 13px;
    }


    .product-price {
        font-size: 20px;

        font-weight: 600;

        margin-bottom: 22px;
    }


    .save-product {
        width: 100%;

        padding: 13px 17px;

        border: 1px solid var(--border);

        border-radius: 100px;

        display: flex;
        align-items: center;
        justify-content: center;

        gap: 8px;

        background: white;

        margin-bottom: 28px;

        transition: 0.2s;
    }


    .save-product:hover {
        background: var(--pink-50);
    }


    .save-product.saved {
        color: var(--pink-400);

        border-color: var(--pink-200);

        background: var(--pink-50);
    }


    /* PRODUCT SECTIONS */

    .product-section {
        padding: 23px 0;

        border-top: 1px solid var(--border);
    }


    .product-section h3 {
        font-size: 14px;

        font-weight: 600;

        margin-bottom: 13px;
    }


    .options {
        display: flex;

        flex-wrap: wrap;

        gap: 8px;
    }


    .option {
        min-width: 50px;

        padding: 9px 14px;

        border-radius: 10px;

        border: 1px solid var(--border);

        background: white;

        font-size: 13px;

        transition: 0.2s;
    }


    .option:hover {
        border-color: var(--pink-300);
    }


    .option.selected {
        background: var(--pink-100);

        border-color: var(--pink-300);

        color: var(--text);
    }


    .description {
        color: var(--muted);

        line-height: 1.7;

        font-size: 14px;
    }


    /* QUANTITY */

    .quantity-control {
        display: inline-flex;

        align-items: center;

        border: 1px solid var(--border);

        border-radius: 12px;

        overflow: hidden;
    }


    .quantity-control button {
        width: 38px;
        height: 38px;

        font-size: 18px;

        background: var(--pink-50);
    }


    .quantity-control span {
        width: 40px;

        text-align: center;

        font-size: 14px;
    }


    /* SELLER */

    .seller-box,
    .delivery-box {
        margin-top: 18px;

        padding: 20px;

        border-radius: var(--radius-medium);

        background: var(--pink-50);
    }


    .small-label {
        color: var(--muted);

        font-size: 11px;

        margin-bottom: 6px;
    }


    .seller-box h3 {
        font-size: 16px;

        font-weight: 600;

        margin-bottom: 7px;
    }


    .seller-box a {
        color: var(--pink-400);

        text-decoration: none;

        font-size: 13px;
    }


    .delivery-box p:last-child {
        color: var(--muted);

        font-size: 13px;

        line-height: 1.6;
    }


    /* BUY */

    .buy-button {
        width: 100%;

        padding: 15px 20px;

        margin-top: 22px;

        border-radius: 100px;

        background: var(--text);

        color: white;

        font-size: 15px;

        transition: 0.2s;
    }


    .buy-button:hover {
        transform: translateY(-2px);
    }


    /* MOBILE */

    @media (max-width: 800px) {

        .product-page {
            width: calc(100% - 32px);

            margin-top: 25px;
        }


        .product-layout {
            grid-template-columns: 1fr;

            gap: 30px;
        }


        .product-gallery {
            position: static;
        }


        .main-product-image {
            aspect-ratio: 0.9;
        }


        .product-information h1 {
            font-size: 34px;
        }

    }


    @media (max-width: 500px) {

        .product-topbar {
            margin-bottom: 25px;
        }


        .product-logo {
            width: 80px;
        }


        .main-product-image {
            border-radius: 22px;
        }


        .product-information h1 {
            font-size: 30px;
        }

    }

</style>

</head><body><main class="product-page">


    <!-- TOP -->

    <div class="product-topbar">

        <a
            href="index.html"
            class="back-link"
        >
            ← Back
        </a>


        <img
            src="leily-logo.png"
            alt="Leily"
            class="product-logo"
        >

    </div>



    <!-- PRODUCT -->

    <section class="product-layout">


        <!-- GALLERY -->

        <div class="product-gallery">

            <div class="main-product-image">

                <div class="main-product-placeholder">
                    Product image
                </div>

            </div>


            <div class="thumbnail-row">

                <button class="thumbnail active">
                    Image 1
                </button>

                <button class="thumbnail">
                    Image 2
                </button>

                <button class="thumbnail">
                    Image 3
                </button>

                <button class="thumbnail">
                    Image 4
                </button>

            </div>

        </div>



        <!-- INFORMATION -->

        <div class="product-information">


            <p class="product-category">
                Clothes
            </p>


            <h1>
                Soft Knit Sweater
            </h1>


            <p class="product-price">
                3,500 DA
            </p>


            <button
                class="save-product"
                id="saveProduct"
            >
                ♡ Save
            </button>



            <!-- COLORS -->

            <div class="product-section">

                <h3>
                    Color
                </h3>


                <div class="options">

                    <button class="option">
                        Black
                    </button>

                    <button class="option">
                        Beige
                    </button>

                    <button class="option">
                        Cream
                    </button>

                </div>

            </div>



            <!-- SIZES -->

            <div class="product-section">

                <h3>
                    Size
                </h3>


                <div class="options">

                    <button class="option">
                        S
                    </button>

                    <button class="option">
                        M
                    </button>

                    <button class="option">
                        L
                    </button>

                    <button class="option">
                        XL
                    </button>

                </div>

            </div>



            <!-- QUANTITY -->

            <div class="product-section">

                <h3>
                    Quantity
                </h3>


                <div class="quantity-control">

                    <button
                        id="minusBtn"
                        type="button"
                    >
                        −
                    </button>


                    <span id="quantity">
                        1
                    </span>


                    <button
                        id="plusBtn"
                        type="button"
                    >
                        +
                    </button>

                </div>

            </div>



            <!-- DESCRIPTION -->

            <div class="product-section">

                <h3>
                    Description
                </h3>


                <p class="description">
                    A soft and comfortable knit sweater,
                    perfect for everyday wear.
                </p>

            </div>



            <!-- SELLER -->

            <div class="seller-box">

                <p class="small-label">
                    Seller
                </p>


                <h3>
                    Sara Boutique
                </h3>


                <a href="#">
                    View seller →
                </a>

            </div>



            <!-- DELIVERY -->

            <div class="delivery-box">

                <p class="small-label">
                    Delivery
                </p>


                <p>
                    Delivery information will be available
                    on the seller's page.
                </p>

            </div>



            <!-- BUY -->

            <button
                class="buy-button"
                id="buyButton"
            >
                Buy
            </button>


        </div>

    </section>

</main>



<script>

    /* SAVE */

    const saveProduct =
        document.getElementById("saveProduct");


    saveProduct.addEventListener(
        "click",
        () => {

            saveProduct.classList.toggle("saved");


            saveProduct.textContent =
                saveProduct.classList.contains("saved")
                    ? "♥ Saved"
                    : "♡ Save";

        }
    );



    /* OPTIONS */

    document
        .querySelectorAll(".option")
        .forEach(option => {

            option.addEventListener(
                "click",
                () => {

                    const group =
                        option.parentElement;

                    group
                        .querySelectorAll(".option")
                        .forEach(item => {

                            item.classList.remove(
                                "selected"
                            );

                        });


                    option.classList.add(
                        "selected"
                    );

                }
            );

        });



    /* QUANTITY */

    const quantityElement =
        document.getElementById("quantity");


    const minusBtn =
        document.getElementById("minusBtn");


    const plusBtn =
        document.getElementById("plusBtn");


    let quantity = 1;


    minusBtn.addEventListener(
        "click",
        () => {

            if (quantity > 1) {

                quantity--;

                quantityElement.textContent =
                    quantity;

            }

        }
    );


    plusBtn.addEventListener(
        "click",
        () => {

            quantity++;

            quantityElement.textContent =
                quantity;

        }
    );



    /* BUY */

    document
        .getElementById("buyButton")
        .addEventListener(
            "click",
            () => {

                alert(
                    "The purchase form will be connected in the next stage."
                );

            }
        );



    /* THUMBNAILS */

    document
        .querySelectorAll(".thumbnail")
        .forEach(thumbnail => {

            thumbnail.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(".thumbnail")
                        .forEach(item => {

                            item.classList.remove(
                                "active"
                            );

                        });


                    thumbnail.classList.add(
                        "active"
                    );

                }
            );

        });

</script>

</body></html>
```
