<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leily — Product</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <a href="index.html" class="back-link">
            ← Back
        </a>

        <img src="leily-logo.png" alt="Leily" class="product-logo">

    </header>


    <main class="product-page">

        <section class="product-card">

            <div class="product-image-area">
                <div class="product-image-placeholder">
                    Product image
                </div>
            </div>


            <div class="product-information">

                <p class="product-category">
                    Clothes
                </p>

                <h1>
                    Soft Knit Sweater
                </h1>

                <p class="product-price">
                    3,500 DA
                </p>


                <button class="save-product">
                    ♡ Save
                </button>


                <div class="product-section">

                    <h3>
                        Colors
                    </h3>

                    <div class="options">

                        <button class="option">
                            Black
                        </button>

                        <button class="option">
                            Beige
                        </button>

                        <button class="option">
                            Cream
                        </button>

                    </div>

                </div>


                <div class="product-section">

                    <h3>
                        Sizes
                    </h3>

                    <div class="options">

                        <button class="option">
                            S
                        </button>

                        <button class="option">
                            M
                        </button>

                        <button class="option">
                            L
                        </button>

                        <button class="option">
                            XL
                        </button>

                    </div>

                </div>


                <div class="product-section">

                    <h3>
                        Description
                    </h3>

                    <p class="description">
                        A soft and comfortable knit sweater,
                        perfect for everyday wear.
                    </p>

                </div>


                <div class="seller-box">

                    <p class="small-label">
                        Seller
                    </p>

                    <h3>
                        Sara Boutique
                    </h3>

                    <a href="#">
                        View seller →
                    </a>

                </div>


                <div class="delivery-box">

                    <p class="small-label">
                        Delivery
                    </p>

                    <p>
                        Delivery information will be available
                        on the seller's page.
                    </p>

                </div>


                <button class="buy-button">
                    Buy
                </button>

            </div>

        </section>

    </main>


</body>
</html>
