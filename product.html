<!DOCTYPE html><html lang="en" dir="ltr"><head><meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Leily</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

    /* =========================
       PRODUCT PAGE
    ========================= */

    .product-page {
        padding: 24px 18px 110px;
        max-width: 1100px;
        margin: 0 auto;
    }

    .product-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
    }

    .back-button {
        text-decoration: none;
        color: inherit;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 7px;
    }

    .product-logo {
        font-weight: 600;
        font-size: 22px;
    }

    .product-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 38px;
        align-items: start;
    }

    /* GALLERY */

    .product-gallery {
        width: 100%;
    }

    .main-image {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 22px;
        background: #f8eef0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .main-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .image-placeholder {
        font-size: 14px;
        color: #9a858b;
    }

    .thumbnail-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 9px;
        margin-top: 10px;
    }

    .thumbnail {
        border: 1px solid transparent;
        background: #f8eef0;
        border-radius: 12px;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        padding: 0;
        cursor: pointer;
    }

    .thumbnail.active {
        border-color: #c99ca8;
    }

    .thumbnail img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* PRODUCT INFO */

    .product-info {
        padding-top: 5px;
    }

    .product-category {
        font-size: 12px;
        color: #9b7e86;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .product-name {
        font-size: 30px;
        line-height: 1.2;
        margin: 0 0 12px;
        font-weight: 600;
    }

    .product-price {
        font-size: 21px;
        font-weight: 600;
        margin-bottom: 20px;
    }

    .save-product {
        width: 100%;
        border: 1px solid #ead9dd;
        background: #fff;
        border-radius: 14px;
        padding: 13px;
        cursor: pointer;
        font-size: 15px;
        margin-bottom: 24px;
    }

    .save-product.saved {
        background: #f8e7eb;
    }

    .option-section {
        margin-bottom: 21px;
    }

    .option-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 9px;
    }

    .option-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .option-button {
        border: 1px solid #e6d6da;
        background: #fff;
        border-radius: 10px;
        padding: 9px 14px;
        cursor: pointer;
        font-size: 13px;
    }

    .option-button.active {
        background: #f7e5e9;
        border-color: #cfa4ae;
    }

    .quantity-control {
        display: flex;
        align-items: center;
        width: fit-content;
        border: 1px solid #e5d7da;
        border-radius: 11px;
        overflow: hidden;
    }

    .quantity-control button {
        border: 0;
        background: #fff;
        width: 38px;
        height: 38px;
        cursor: pointer;
        font-size: 17px;
    }

    .quantity-control span {
        width: 38px;
        text-align: center;
        font-size: 14px;
    }

    .description {
        color: #6f6266;
        font-size: 14px;
        line-height: 1.8;
        margin: 24px 0;
    }

    .seller-box {
        background: #faf3f4;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 14px;
    }

    .seller-label {
        font-size: 11px;
        color: #9b7e86;
        margin-bottom: 5px;
    }

    .seller-name {
        font-size: 15px;
        font-weight: 600;
    }

    .delivery-box {
        border: 1px solid #eee1e4;
        border-radius: 15px;
        padding: 15px;
        margin-bottom: 20px;
    }

    .delivery-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
    }

    .delivery-text {
        font-size: 13px;
        color: #776a6e;
        line-height: 1.6;
    }

    .buy-button {
        width: 100%;
        border: 0;
        border-radius: 15px;
        padding: 15px;
        background: #dcaeb9;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
    }

    .buy-button:active {
        transform: scale(.99);
    }

    @media (max-width: 750px) {

        .product-page {
            padding-top: 18px;
        }

        .product-layout {
            grid-template-columns: 1fr;
            gap: 25px;
        }

        .product-name {
            font-size: 26px;
        }

    }

</style>

</head><body><div class="product-page"><!-- TOP BAR -->

<div class="product-topbar">

    <a
        href="index.html"
        class="back-button"
    >
        ← <span>Back</span>
    </a>

    <div class="product-logo">
        Leily
    </div>

    <div style="width: 45px;"></div>

</div>



<!-- PRODUCT -->

<div class="product-layout">


    <!-- GALLERY -->

    <div class="product-gallery">


        <div class="main-image">

            <img
                id="mainProductImage"
                src=""
                alt=""
            >

            <span
                id="imagePlaceholder"
                class="image-placeholder"
            >
                Product image
            </span>

        </div>


        <div
            class="thumbnail-row"
            id="thumbnailRow"
        >
        </div>


    </div>



    <!-- INFO -->

    <div class="product-info">


        <div
            class="product-category"
            id="productCategory"
        >
            Category
        </div>


        <h1
            class="product-name"
            id="productName"
        >
            Product
        </h1>


        <div
            class="product-price"
            id="productPrice"
        >
            0 DA
        </div>


        <button
            class="save-product"
            id="saveProduct"
        >
            ♡ Save product
        </button>



        <!-- COLORS -->

        <div
            class="option-section"
            id="colorSection"
        >

            <div class="option-title">
                Color
            </div>

            <div
                class="option-buttons"
                id="colorOptions"
            >
            </div>

        </div>



        <!-- SIZES -->

        <div
            class="option-section"
            id="sizeSection"
        >

            <div class="option-title">
                Size
            </div>

            <div
                class="option-buttons"
                id="sizeOptions"
            >
            </div>

        </div>



        <!-- QUANTITY -->

        <div class="option-section">

            <div class="option-title">
                Quantity
            </div>

            <div class="quantity-control">

                <button id="minusButton">
                    −
                </button>

                <span id="quantity">
                    1
                </span>

                <button id="plusButton">
                    +
                </button>

            </div>

        </div>



        <!-- DESCRIPTION -->

        <p
            class="description"
            id="productDescription"
        >
        </p>



        <!-- SELLER -->

        <div class="seller-box">

            <div class="seller-label">
                Seller
            </div>

            <div
                class="seller-name"
                id="sellerName"
            >
            </div>

        </div>



        <!-- DELIVERY -->

        <div class="delivery-box">

            <div class="delivery-title">
                Delivery
            </div>

            <div
                class="delivery-text"
                id="deliveryText"
            >
            </div>

        </div>



        <!-- BUY -->

        <button
            class="buy-button"
            id="buyButton"
        >
            Buy this product
        </button>


    </div>

</div>

</div><script>

    /* =========================
       PRODUCT DATA
    ========================= */

    const products = {

        sweater: {

            name: "Soft Knit Sweater",

            category: "Clothes",

            price: "3,500 DA",

            seller: "Sara Boutique",

            description:
                "A soft and comfortable knit sweater for everyday wear. Simple, warm and easy to style.",

            delivery:
                "Delivery information will be provided by the seller.",

            colors: [
                "Black",
                "Beige",
                "Cream"
            ],

            sizes: [
                "S",
                "M",
                "L",
                "XL"
            ],

            images: []

        },


        bag: {

            name: "Mini Shoulder Bag",

            category: "Bags",

            price: "4,200 DA",

            seller: "Lina Store",

            description:
                "A small and elegant shoulder bag, perfect for everyday outfits and simple looks.",

            delivery:
                "Delivery information will be provided by the seller.",

            colors: [
                "Black",
                "Brown",
                "Cream"
            ],

            sizes: [],

            images: []

        },


        necklace: {

            name: "Pearl Necklace",

            category: "Accessories",

            price: "2,500 DA",

            seller: "Lily Accessories",

            description:
                "A delicate pearl necklace with a simple feminine design that works beautifully with everyday outfits.",

            delivery:
                "Delivery information will be provided by the seller.",

            colors: [
                "White",
                "Gold"
            ],

            sizes: [],

            images: []

        },


        flats: {

            name: "Classic Flats",

            category: "Shoes",

            price: "4,800 DA",

            seller: "Nora Shoes",

            description:
                "Classic comfortable flats designed for an easy everyday look.",

            delivery:
                "Delivery information will be provided by the seller.",

            colors: [
                "Black",
                "Beige"
            ],

            sizes: [
                "36",
                "37",
                "38",
                "39",
                "40"
            ],

            images: []

        }

    };



    /* =========================
       GET PRODUCT
    ========================= */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const productId =
        params.get("product") || "sweater";

    const product =
        products[productId] || products.sweater;



    /* =========================
       ELEMENTS
    ========================= */

    const productName =
        document.getElementById("productName");

    const productCategory =
        document.getElementById("productCategory");

    const productPrice =
        document.getElementById("productPrice");

    const productDescription =
        document.getElementById("productDescription");

    const sellerName =
        document.getElementById("sellerName");

    const deliveryText =
        document.getElementById("deliveryText");

    const colorOptions =
        document.getElementById("colorOptions");

    const sizeOptions =
        document.getElementById("sizeOptions");

    const colorSection =
        document.getElementById("colorSection");

    const sizeSection =
        document.getElementById("sizeSection");



    /* =========================
       FILL PRODUCT
    ========================= */

    productName.textContent =
        product.name;

    productCategory.textContent =
        product.category;

    productPrice.textContent =
        product.price;

    productDescription.textContent =
        product.description;

    sellerName.textContent =
        product.seller;

    deliveryText.textContent =
        product.delivery;



    /* =========================
       COLORS
    ========================= */

    if (product.colors.length === 0) {

        colorSection.style.display =
            "none";

    } else {

        product.colors.forEach(
            (color, index) => {

                const button =
                    document.createElement("button");

                button.className =
                    "option-button";

                button.textContent =
                    color;

                if (index === 0) {
                    button.classList.add("active");
                }

                button.addEventListener(
                    "click",
                    () => {

                        colorOptions
                            .querySelectorAll(
                                ".option-button"
                            )
                            .forEach(
                                item => {
                                    item.classList.remove(
                                        "active"
                                    );
                                }
                            );

                        button.classList.add(
                            "active"
                        );

                    }
                );

                colorOptions.appendChild(
                    button
                );

            }
        );

    }



    /* =========================
       SIZES
    ========================= */

    if (product.sizes.length === 0) {

        sizeSection.style.display =
            "none";

    } else {

        product.sizes.forEach(
            (size, index) => {

                const button =
                    document.createElement("button");

                button.className =
                    "option-button";

                button.textContent =
                    size;

                if (index === 0) {
                    button.classList.add("active");
                }

                button.addEventListener(
                    "click",
                    () => {

                        sizeOptions
                            .querySelectorAll(
                                ".option-button"
                            )
                            .forEach(
                                item => {
                                    item.classList.remove(
                                        "active"
                                    );
                                }
                            );

                        button.classList.add(
                            "active"
                        );

                    }
                );

                sizeOptions.appendChild(
                    button
                );

            }
        );

    }



    /* =========================
       QUANTITY
    ========================= */

    let quantity = 1;

    const quantityElement =
        document.getElementById("quantity");

    document
        .getElementById("minusButton")
        .addEventListener(
            "click",
            () => {

                if (quantity > 1) {
                    quantity--;
                }

                quantityElement.textContent =
                    quantity;

            }
        );


    document
        .getElementById("plusButton")
        .addEventListener(
            "click",
            () => {

                quantity++;

                quantityElement.textContent =
                    quantity;

            }
        );



    /* =========================
       SAVE
    ========================= */

    const saveButton =
        document.getElementById("saveProduct");

    saveButton.addEventListener(
        "click",
        () => {

            saveButton.classList.toggle(
                "saved"
            );

            saveButton.textContent =
                saveButton.classList.contains("saved")
                    ? "♥ Saved"
                    : "♡ Save product";

        }
    );



    /* =========================
       BUY
    ========================= */

    document
        .getElementById("buyButton")
        .addEventListener(
            "click",
            () => {

                alert(
                    "The purchase form will be connected in the next step."
                );

            }
        );

</script></body>
</html>
